name: bug report
description: report a problem with SA-CycleGAN-2.5D
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: thanks for taking the time to file a bug report. please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: description
      description: a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: steps to reproduce
      description: minimal command, script, or code to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: environment
      description: os, python version, torch/cuda version, and package version or commit sha.
      placeholder: |
        - os:
        - python:
        - torch / cuda:
        - neuroscope version / commit:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: logs / traceback
      render: shell
