# neuroscope ci pipeline
# lint + format consolidated on ruff (pinned); metric unit tests are the blocking
# gate; mypy + bandit run informationally over the legacy tree.

name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: install ruff (pinned)
        run: pip install ruff==0.14.11
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: run metric unit tests (with coverage)
        run: pytest tests/ --cov=neuroscope --cov=journal_extension --cov-report=term-missing

  typecheck:
    name: type check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: run mypy
        run: mypy neuroscope/

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: install bandit
        run: pip install "bandit[toml]"
      - name: run bandit security scan
        run: bandit -c pyproject.toml -r neuroscope/ -ll

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: install pre-commit
        run: pip install pre-commit
      - name: run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
