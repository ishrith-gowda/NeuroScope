[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscope"
version = "0.2.0"
description = "self-attention cyclegan with tri-planar context for multi-site mri harmonization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ishrith Gowda", email = "ishrithgowda@berkeley.edu"},
]
keywords = [
    "mri harmonization",
    "cyclegan",
    "self-attention",
    "domain adaptation",
    "medical imaging",
    "glioma",
    "neuroimaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "nibabel>=5.4.2",
    "simpleitk>=2.5.5",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "tensorboard>=2.20.0",
    "tqdm>=4.68.3",
    "pyyaml>=6.0.3",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "flake8>=7.3.0",
    "flake8-bugbear>=25.11.29",
    "flake8-comprehensions>=3.17.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
    "myst-parser>=4.0.1",
]

[project.urls]
Homepage = "https://github.com/ishrith-gowda/SA-CycleGAN-2.5D"
Repository = "https://github.com/ishrith-gowda/SA-CycleGAN-2.5D"
Issues = "https://github.com/ishrith-gowda/SA-CycleGAN-2.5D/issues"

# ---------------------------------------------------------------------------
# setuptools: only the importable neuroscope/ package is shipped. the repo root
# also holds non-package dirs (journal_extension/, scripts/, results/, arxiv/,
# ...), so scope discovery explicitly to avoid flat-layout ambiguity.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["neuroscope*"]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | preprocessed
  | preprocessed_registered
  | arxiv
)/
'''

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["neuroscope"]
known_third_party = ["torch", "torchvision", "numpy", "scipy", "nibabel", "matplotlib", "pandas", "sklearn", "tqdm", "yaml", "tensorboard"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*.venv*", "preprocessed/*"]

# ---------------------------------------------------------------------------
# ruff (fast python linter, replaces flake8 + isort + pyflakes + more)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
# scope is explicit, not tied to .gitignore: our gitignore patterns (data/,
# figures/, results/, ...) over-match tracked SOURCE dirs (e.g. neuroscope/data/),
# which would silently hide them from linting. only non-source output/data/build
# dirs are excluded, with root-anchored paths so source subdirs stay linted.
respect-gitignore = false
exclude = [
    # build / environment
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    # raw + preprocessed data (root-anchored: neuroscope/data/ is still linted)
    "/data",
    "/preprocessed",
    "/preprocessed_registered",
    "PKG*",
    # experiment + training artifacts (outputs, not source)
    "/experiments",
    "/experiments_from_gpu",
    "/baseline_training_progress",
    "/final_trained_model",
    "/cluster_backup",
    "/runs",
    "/mlruns",
    "/checkpoints",
    # result / figure outputs
    "/results",
    "/evaluation_results",
    "/figures",
    "journal_extension/figures",
    "journal_extension/results",
    "journal_extension/experiments",
    # publication staging
    "/arxiv",
    "/huggingface",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "B905",   # zip without strict= (python 3.9 compat)
    "UP007",  # use X | Y for union types (python 3.9 compat)
    "SIM108", # ternary operator (readability)
    "E741",   # ambiguous variable names (common in math-heavy code: l, I, O)
    "B008",   # function call in default argument (common in pytorch)
    "RUF012", # mutable class attributes (dataclass pattern)
    "RUF001", # ambiguous unicode (greek/math symbols are intentional)
    "RUF002", # ambiguous unicode in docstrings (math symbols)
    "RUF003", # ambiguous unicode in comments (math symbols)
    "B904",   # raise ... from err (stylistic)
    "B027",   # empty method in abstract base (intentional hooks)
    "E722",   # bare except (tolerated in research scripts)
    "SIM115", # open() without a context manager (intentional in some loaders)
    "SIM105", # contextlib.suppress over try/except/pass (opinionated)
    "SIM102", # nested if (readability preference)
    "B007",   # loop control var not used in body (common in research loops)
    "B024",   # abstract base without abstract methods (intentional bases)
    "B017",   # assertRaises(Exception) (acceptable in smoke tests)
    "RUF005", # iterable unpacking over concatenation (style)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "E402"]  # star re-exports + late imports in __init__
"tests/*" = ["B011", "SIM"]  # assert usage in tests is fine
# intentional sys.path / matplotlib-backend setup before imports
"journal_extension/scripts/*" = ["E402"]
"tools/**" = ["E402"]
# top-level scripts/ is the legacy pre-journal_extension pipeline; E402 is kept
# for the intentional sys.path / matplotlib-backend setup before imports.
"scripts/**" = ["E402"]
# legacy training/logging pipeline (used by the unfinished Ext E federated
# script); unused-import ignores pending the full legacy-lint repair pass.
"neuroscope/training/**" = ["F401"]
"neuroscope/models/backbones/**" = ["F401"]  # optional torchvision backbones imported for availability

[tool.ruff.lint.isort]
known-first-party = ["neuroscope"]

# ---------------------------------------------------------------------------
# flake8 (configured via .flake8 file since pyproject.toml not supported)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
    ".venv",
    "preprocessed",
    "arxiv",
]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "nibabel.*",
    "simpleitk.*",
    "scipy.*",
    "sklearn.*",
    "skimage.*",
    "matplotlib.*",
    "seaborn.*",
    "pandas.*",
    "tensorboard.*",
    "tqdm.*",
    "yaml.*",
    "h5py.*",
    "monai.*",
    "pyradiomics.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["neuroscope/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-x",
    "--timeout=120",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring gpu",
    "integration: marks integration tests",
    "data: marks tests requiring real data",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["neuroscope", "journal_extension"]
omit = [
    "neuroscope/tests/*",
    "neuroscope/*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
# regression floor only: the metric unit tests are a small research suite (~2%).
# this prevents coverage silently collapsing to 0; expanding the suite is future work.
fail_under = 1

# ---------------------------------------------------------------------------
# bandit (security linter)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["neuroscope/tests", ".venv", "build", "dist"]
skips = [
    "B101", # assert usage is fine in non-production code
    # torch.load is used only on trusted internal checkpoints (our own training
    # artifacts), never on untrusted input; weights_only=True is not viable for
    # full checkpoints carrying optimizer/config state. see SECURITY.md.
    "B614",
]
